plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.smsretriever'
version = '0.1.0'

android {
  namespace "expo.modules.smsretriever"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // The only Google dependency. It carries SmsRetriever and nothing else:
  // no READ_SMS / RECEIVE_SMS permission is declared by this artifact.
  implementation "com.google.android.gms:play-services-auth-api-phone:18.1.0"
}
